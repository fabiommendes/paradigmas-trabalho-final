[project]
name = "sudoku-backend"
version = "0.1.0"
description = "API HTTP (FastAPI) que expõe o resolvedor/gerador de Sudoku escrito em Prolog"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "janus-swi>=1.5",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
